<!-- قسم تسجيل الدخول الآمن -->
<div id="loginSection" class="mb-4 p-3 border rounded bg-light">
    <h4 class="mb-3 text-secondary">تسجيل الدخول للنظام</h4>
    <div class="row g-3">
        <div class="col-md-5">
            <input type="text" id="username" class="form-control" placeholder="اسم المستخدم">
        </div>
        <div class="col-md-5">
            <input type="password" id="password" class="form-control" placeholder="كلمة المرور">
        </div>
        <div class="col-md-2">
            <button class="btn btn-dark w-100" onclick="login()">دخول</button>
        </div>
    </div>
</div>
